<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Treino A — Peito, Ombros e Tríceps">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Treino A</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:520px;margin:auto;padding:20px 16px 110px}.title{color:#ff5500;font-size:28px;font-weight:900;margin:0}.sub{color:#a0a0a0;font-size:13px;margin:3px 0 20px}
.card{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:15px;padding:15px;margin:0 0 16px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:17px;font-weight:800}.badge{font-size:10px;background:#2c2c2e;color:#999;border-radius:20px;padding:5px 9px;white-space:nowrap}.badge.done{background:#1b3821;color:#34c759}
.set{background:#242426;border:1px solid #323236;border-radius:11px;padding:12px;margin-top:10px}.sethead{display:flex;justify-content:space-between;gap:8px}.sethead b{color:#ff5500;font-size:11px}.sethead span{color:#999;font-size:10px;text-align:right}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.inputs label{color:#8e8e93;font-size:9px;font-weight:800}.inputs input{width:100%;margin-top:4px;background:#151517;color:#fff;border:1px solid #3a3a3c;border-radius:8px;padding:10px;text-align:center;font-size:16px}.btn{width:100%;border:1px solid #3a3a3c;background:#2c2c2e;color:#fff;border-radius:9px;padding:11px;font-weight:700}.btn.done{background:#1b3821;border-color:#2e7d32;color:#4cd964}.finish{margin-top:11px}.timer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 20px));background:#1c1c1e;border:1px solid #333;border-top:2px solid #ff5500;border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 5px 25px #0008}.clock{color:#ffcc00;font:900 23px monospace}.small{color:#888;font-size:9px;font-weight:800}.presets{display:flex;gap:4px}.preset{padding:7px 8px;border-radius:7px;border:1px solid #444;background:#2c2c2e;color:#fff;font-size:10px}.start{background:#34c759;border:0}.reset{display:block;margin:8px auto;color:#777;background:none;border:0;padding:8px}
</style>
</head>
<body><div class="app">
<h1 class="title">TREINO A</h1><div class="sub">Peito, Ombros e Tríceps (Mobilidade de ombros)</div>
<div id="workout"></div>
<button class="reset" id="reset">↻ Limpar treino</button>
</div>
<div class="timer"><div><div class="small">DESCANSO</div><div class="clock" id="clock">00:00</div></div><div class="presets"><button class="preset" data-sec="60">1m</button><button class="preset" data-sec="120">2m</button><button class="preset" data-sec="180">3m</button><button class="preset start" id="start">Iniciar</button></div></div>
<script src="app.js"></script>
</body></html>
